[package]
name = "libproxybase"
version = "0.14.0"
edition = "2021"
description = "Core engine library for ProxyBase networking, market connectivity, proxying, and telemetry"
license = "MIT"
readme = "README.md"
repository = "https://github.com/proxybase/proxybase2"
keywords = ["proxy", "socks5", "networking", "telemetry", "market"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
yamux = "0.13"
rustls = "0.23"
k256 = { version = "0.13", features = ["ecdsa"] }
bip39 = { version = "2", features = ["rand"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
governor = "0.7"
sysinfo = "0.31"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.10"
dashmap = "6"
url = "2"

# --- tunnel (VPN mode) ---
tun-rs = { version = "2.8.13", features = ["async_tokio"] }
ipstack = "1.0.1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
ipnet = "2"
socket2 = { version = "0.6", features = ["all"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Rpc",
] }

[dev-dependencies]
etherparse = "0.21"
tempfile = "3"
